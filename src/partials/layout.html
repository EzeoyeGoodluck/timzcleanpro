<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="{{name}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{ogDescription}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ogImage}}">
  <meta name="theme-color" content="#142643">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HouseCleaningService",
    "name": "{{name}}",
    "url": "{{url}}",
    "telephone": "{{phoneTel}}",
    "email": "{{email}}",
    "image": "{{ogImage}}",
    "priceRange": "££",
    "address": { "@type": "PostalAddress", "addressLocality": "{{locality}}", "addressRegion": "{{region}}", "postalCode": "{{postcode}}", "addressCountry": "GB" },
    "areaServed": ["Millom", "Haverigg", "Silecroft", "Kirksanton", "Broughton-in-Furness", "Bootle"],
    "aggregateRating": { "@type": "AggregateRating", "ratingValue": "{{rating}}", "reviewCount": "{{reviewCount}}" },
    "openingHoursSpecification": [
      { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "08:00", "closes": "18:00" },
      { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "15:00" }
    ]
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{> header}}
  <main id="main">
{{content}}
  </main>
  {{> footer}}
  <div class="call-bar">
    <a class="btn btn--brand" href="{{telHref}}">Call {{phone}}</a>
    <a class="btn btn--primary" href="/contact">Free Quote</a>
  </div>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
